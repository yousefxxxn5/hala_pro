<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2419" />
      <stop offset="50%" stop-color="#0A1811" />
      <stop offset="100%" stop-color="#060E0A" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006C35" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>

    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#006C35" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#006C35" flood-opacity="0.3" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="340" cy="300" r="220" fill="url(#glowGlow)" />
  <circle cx="500" cy="200" r="140" fill="#10B981" opacity="0.08" filter="blur(30px)" />
  <circle cx="200" cy="420" r="120" fill="#C5A059" opacity="0.06" filter="blur(25px)" />

  <!-- ══════════════════════════════════════════
       MAIN SOFTWARE PLATFORM WINDOW
       ══════════════════════════════════════════ -->
  <g transform="translate(60, 50)" filter="url(#shadowLg)">
    <!-- Main Window Outer Frame -->
    <rect width="520" height="380" rx="20" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />

    <!-- Window Top Header Bar -->
    <path d="M0 20 C0 8.95 8.95 0 20 0 L500 0 C511.05 0 520 8.95 520 20 L520 44 L0 44 Z" fill="#07120C" />
    <line x1="0" y1="44" x2="520" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="24" cy="22" r="5" fill="#EF4444" opacity="0.85" />
    <circle cx="38" cy="22" r="5" fill="#F59E0B" opacity="0.85" />
    <circle cx="52" cy="22" r="5" fill="#10B981" opacity="0.85" />

    <!-- Window Title / URL -->
    <rect x="140" y="11" width="240" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" />
    <!-- Lock Icon -->
    <path d="M195 19v-2a3 3 0 0 1 6 0v2m-8 0h10a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" fill="none" stroke="#10B981" stroke-width="1.2" />
    <text x="260" y="26" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">cloud.halasystems.sa</text>

    <!-- Status Live Badge in Header -->
    <rect x="420" y="12" width="84" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="432" cy="22" r="3.5" fill="#10B981" />
    <text x="466" y="26" fill="#10B981" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ZATCA معتمد</text>

    <!-- ── Left Sidebar Inside Window ── -->
    <rect x="0" y="44" width="60" height="336" fill="#09150E" opacity="0.7" />
    <line x1="60" y1="44" x2="60" y2="380" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

    <!-- Sidebar Active Icon (Dashboard) -->
    <rect x="12" y="60" width="36" height="36" rx="10" fill="rgba(0, 108, 53, 0.35)" stroke="#10B981" stroke-width="1.2" />
    <path d="M24 74h4v8h-4zm6-6h4v14h-4zm6 4h4v10h-4z" fill="#10B981" />

    <!-- Other Nav Icons -->
    <rect x="18" y="112" width="24" height="24" rx="6" fill="rgba(255, 255, 255, 0.04)" />
    <path d="M25 120h10M25 124h6" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />

    <rect x="18" y="152" width="24" height="24" rx="6" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="30" cy="164" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />

    <rect x="18" y="192" width="24" height="24" rx="6" fill="rgba(255, 255, 255, 0.04)" />
    <path d="M26 200l4 4 4-4" stroke="#64748B" stroke-width="1.5" fill="none" />

    <!-- ── Main Dashboard Content Area ── -->

    <!-- Top Greeting Row -->
    <text x="80" y="76" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="14" font-weight="700">منظومة هلا لإدارة الموارد السحابية ERP</text>
    <text x="80" y="92" fill="#64748B" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10">لوحة التحكم المركزية • المملكة العربية السعودية</text>

    <!-- 3 Summary Metric Cards -->
    <!-- Card 1: Revenue -->
    <g transform="translate(80, 108)">
      <rect width="128" height="66" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
      <text x="12" y="20" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="600">الفواتير الإلكترونية</text>
      <text x="12" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">154,820</text>
      <!-- Trend Tag -->
      <rect x="12" y="48" width="46" height="13" rx="4" fill="rgba(16, 185, 129, 0.15)" />
      <text x="35" y="58" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" text-anchor="middle">↑ +18.4%</text>
    </g>

    <!-- Card 2: ERP Operations -->
    <g transform="translate(220, 108)">
      <rect width="128" height="66" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
      <text x="12" y="20" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="600">إجمالي العمليات</text>
      <text x="12" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">4.82M <tspan font-size="10" fill="#C5A059">ر.س</tspan></text>
      <rect x="12" y="48" width="56" height="13" rx="4" fill="rgba(197, 160, 89, 0.15)" />
      <text x="40" y="58" fill="#C5A059" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="8" font-weight="700" text-anchor="middle">نشاط سحابي</text>
    </g>

    <!-- Card 3: Cloud Uptime -->
    <g transform="translate(360, 108)">
      <rect width="140" height="66" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
      <text x="12" y="20" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="600">كفاءة المنظومة</text>
      <text x="12" y="42" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">99.98%</text>
      <rect x="12" y="48" width="58" height="13" rx="4" fill="rgba(16, 185, 129, 0.15)" />
      <text x="41" y="58" fill="#10B981" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="8" font-weight="700" text-anchor="middle">استقرار عالي</text>
    </g>

    <!-- ── Live Analytics Chart Block ── -->
    <g transform="translate(80, 190)">
      <rect width="420" height="170" rx="12" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

      <!-- Chart Header -->
      <text x="16" y="24" fill="#E2E8F0" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="700">مؤشر أداء العمليات والربط التكاملي (ZATCA Phase 2)</text>
      <text x="390" y="24" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">Live Sync ●</text>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="50" x2="400" y2="50" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="3,3" />
      <line x1="20" y1="85" x2="400" y2="85" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="3,3" />
      <line x1="20" y1="120" x2="400" y2="120" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="3,3" />

      <!-- Chart Area Fill -->
      <path d="M 20 125 Q 70 100, 120 110 T 220 70 T 310 55 T 400 35 L 400 145 L 20 145 Z" fill="url(#chartGrad)" />

      <!-- Chart Line -->
      <path d="M 20 125 Q 70 100, 120 110 T 220 70 T 310 55 T 400 35" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

      <!-- Chart Data Dots -->
      <circle cx="120" cy="110" r="3.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
      <circle cx="220" cy="70" r="3.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
      <circle cx="310" cy="55" r="3.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
      <circle cx="400" cy="35" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />

      <!-- Chart Days Labels -->
      <text x="30" y="160" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">السبت</text>
      <text x="100" y="160" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">الأحد</text>
      <text x="170" y="160" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">الاثنين</text>
      <text x="240" y="160" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">الثلاثاء</text>
      <text x="310" y="160" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">الأربعاء</text>
      <text x="380" y="160" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">اليوم</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════
       FLOATING OVERLAY CARD 1: SMART POS / INVOICE (Left Bottom)
       ══════════════════════════════════════════ -->
  <g transform="translate(30, 360)" filter="url(#cardShadow)">
    <rect width="210" height="180" rx="16" fill="#0A1810" stroke="#006C35" stroke-width="1.5" />
    <rect width="210" height="180" rx="16" fill="rgba(255, 255, 255, 0.02)" />

    <!-- Card Header -->
    <rect x="16" y="16" width="32" height="32" rx="8" fill="rgba(16, 185, 129, 0.2)" />
    <!-- Checkmark SVG -->
    <path d="M26 32l4 4 8-8" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="28" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="700">فاتورة ضريبية معتمدة</text>
    <text x="56" y="42" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">#INV-2026-8941</text>

    <line x1="16" y1="58" x2="194" y2="58" stroke="rgba(255, 255, 255, 0.08)" />

    <!-- Invoice Details -->
    <text x="16" y="78" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10">قيمة المعاملة:</text>
    <text x="194" y="78" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="end">SAR 12,450.00</text>

    <text x="16" y="100" fill="#94A3B8" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10">ضريبة القيمة المضافة 15%:</text>
    <text x="194" y="100" fill="#C5A059" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="end">SAR 1,867.50</text>

    <!-- ZATCA Verified Stamp -->
    <rect x="16" y="120" width="178" height="42" rx="8" fill="rgba(0, 108, 53, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="36" cy="141" r="10" fill="#006C35" />
    <path d="M32 141l3 3 6-6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <text x="52" y="137" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" font-weight="700">تمت المصادقة والختم الرقمي</text>
    <text x="52" y="151" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Cryptographic Stamp • ZATCA Phase 2</text>
  </g>

  <!-- ══════════════════════════════════════════
       FLOATING OVERLAY CARD 2: SAUDI SECURITY / NCA (Top Right)
       ══════════════════════════════════════════ -->
  <g transform="translate(480, 20)" filter="url(#shadowGlow)">
    <rect width="180" height="96" rx="14" fill="#0A1810" stroke="rgba(197, 160, 89, 0.5)" stroke-width="1.2" />
    <rect width="180" height="96" rx="14" fill="rgba(255, 255, 255, 0.02)" />

    <!-- Shield Icon -->
    <rect x="14" y="16" width="34" height="34" rx="8" fill="rgba(197, 160, 89, 0.15)" />
    <path d="M31 23l9 4v7c0 5-4 9-9 11-5-2-9-6-9-11v-7z" fill="none" stroke="#E2B755" stroke-width="1.8" />

    <text x="56" y="30" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="700">أمن سيبراني معتمد</text>
    <text x="56" y="44" fill="#C5A059" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9">ضوابط الهيئة الوطنية NCA</text>

    <!-- Sub badge -->
    <rect x="14" y="60" width="152" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" />
    <text x="90" y="75" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">🇸🇦 سيرفرات محلية داخل المملكة</text>
  </g>

  <!-- ══════════════════════════════════════════
       FLOATING TRUST PILL (Center Bottom)
       ══════════════════════════════════════════ -->
  <g transform="translate(280, 480)" filter="url(#shadowGlow)">
    <rect width="260" height="52" rx="26" fill="url(#primaryGrad)" />
    <!-- Pulse Circle -->
    <circle cx="28" cy="26" r="12" fill="#FFFFFF" opacity="0.2" />
    <circle cx="28" cy="26" r="6" fill="#FFFFFF" />
    <text x="52" y="24" fill="#FFFFFF" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="800">+350 مؤسسة وشركة سعودية</text>
    <text x="52" y="40" fill="rgba(255, 255, 255, 0.85)" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10">تعتمد على حلول هلا سيستم البرمجية</text>
  </g>
</svg>
